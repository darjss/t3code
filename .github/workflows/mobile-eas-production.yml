name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build (+ auto-submit to TestFlight) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
          - swiftui-beta-review
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

jobs:
  production:
    name: EAS Production ${{ inputs.mode }}
    if: inputs.mode != 'swiftui-beta-review'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - name: Build and submit
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ${{ inputs.platform }} --profile production --auto-submit --non-interactive --no-wait

      - name: Publish OTA update
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform ${{ inputs.platform }} \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive

  swiftui-beta-review:
    name: Submit SwiftUI build 5 for beta review
    if: inputs.mode == 'swiftui-beta-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Submit build 5
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto")

          const bundleId = "com.t3tools.t3code.swiftui"
          const targetBuildNumber = "5"
          const previousBuildNumber = "4"
          const apiBase = "https://api.appstoreconnect.apple.com/v1"

          const required = ["APPLE_API_KEY", "APPLE_API_KEY_ID", "APPLE_API_ISSUER"]
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is not configured`)
          }

          const base64url = (value) => Buffer.from(value).toString("base64url")
          const createToken = () => {
            const issuedAt = Math.floor(Date.now() / 1000)
            const header = base64url(JSON.stringify({
              alg: "ES256",
              kid: process.env.APPLE_API_KEY_ID,
              typ: "JWT",
            }))
            const payload = base64url(JSON.stringify({
              iss: process.env.APPLE_API_ISSUER,
              iat: issuedAt,
              exp: issuedAt + 1_200,
              aud: "appstoreconnect-v1",
            }))
            const unsigned = `${header}.${payload}`
            const signature = crypto.sign("sha256", Buffer.from(unsigned), {
              key: process.env.APPLE_API_KEY,
              dsaEncoding: "ieee-p1363",
            })
            return `${unsigned}.${signature.toString("base64url")}`
          }

          const request = async (path, options = {}) => {
            const response = await fetch(`${apiBase}${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${createToken()}`,
                "Content-Type": "application/json",
                ...options.headers,
              },
            })
            const body = await response.text()
            const json = body ? JSON.parse(body) : null
            if (!response.ok) {
              const details = json?.errors?.map((error) =>
                `${error.status ?? response.status} ${error.code ?? ""}: ${error.detail ?? error.title ?? "Unknown error"}`
              ).join("; ")
              const error = new Error(details || `${response.status} ${response.statusText}`)
              error.status = response.status
              throw error
            }
            return json
          }

          const query = (path, params) => {
            const search = new URLSearchParams(params)
            return `${path}?${search}`
          }

          const apps = await request(query("/apps", {
            "filter[bundleId]": bundleId,
            limit: "2",
          }))
          if (apps.data.length !== 1) {
            throw new Error(`Expected one App Store Connect app for ${bundleId}; found ${apps.data.length}`)
          }
          const appId = apps.data[0].id

          const findBuild = async (buildNumber) => {
            const builds = await request(query("/builds", {
              "filter[app]": appId,
              "filter[version]": buildNumber,
              "fields[builds]": "version,uploadedDate,processingState",
              sort: "-uploadedDate",
              limit: "1",
            }))
            return builds.data[0] ?? null
          }

          let build = null
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            build = await findBuild(targetBuildNumber)
            const state = build?.attributes?.processingState ?? "NOT_FOUND"
            console.log(`Build ${targetBuildNumber}: ${state}`)
            if (state === "VALID") break
            if (["FAILED", "INVALID"].includes(state)) {
              throw new Error(`Build ${targetBuildNumber} cannot be submitted: ${state}`)
            }
            if (attempt === 40) throw new Error(`Build ${targetBuildNumber} did not finish processing`)
            await new Promise((resolve) => setTimeout(resolve, 15_000))
          }

          const reviewForBuild = async (buildId) => {
            try {
              return (await request(`/builds/${buildId}/betaAppReviewSubmission`)).data
            } catch (error) {
              if (error.status === 404) return null
              throw error
            }
          }

          const previousBuild = await findBuild(previousBuildNumber)
          if (previousBuild) {
            const previousReview = await reviewForBuild(previousBuild.id)
            console.log(`Build ${previousBuildNumber} review: ${previousReview?.attributes?.betaReviewState ?? "NOT_SUBMITTED"}`)
          }

          let review = await reviewForBuild(build.id)
          if (!review) {
            const submitted = await request("/betaAppReviewSubmissions", {
              method: "POST",
              body: JSON.stringify({
                data: {
                  type: "betaAppReviewSubmissions",
                  relationships: {
                    build: {
                      data: { type: "builds", id: build.id },
                    },
                  },
                },
              }),
            })
            review = submitted.data
          }

          console.log(`Build ${targetBuildNumber} review: ${review.attributes.betaReviewState}`)
          console.log(`Submitted TestFlight build ${targetBuildNumber} for beta app review.`)
          NODE
